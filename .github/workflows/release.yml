name: Tagged release

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # These tests need only tracked source. Proprietary firmware, NAND and
      # locally reconstructed ROM binaries are deliberately not in Git.
      - name: Python source tests
        run: python3 -m unittest scripts.tests.test_np560_system_nand_build scripts.tests.test_np560_owned_npe_codec
      - name: Browser input test
        run: node scripts/tests/test_np560_pointer_input.js

  windows-build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-pixman
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-distlib
            mingw-w64-ucrt-x86_64-python-packaging
            mingw-w64-ucrt-x86_64-pkgconf
      - name: Compile native Windows emulator
        shell: pwsh
        run: ./scripts/build_np560_windows.ps1 -BuildDir "$env:RUNNER_TEMP/np560-build" -MsysRoot '${{ steps.msys2.outputs.msys2-location }}' -Jobs 4
      - name: Package self-contained Windows emulator
        shell: pwsh
        run: ./scripts/package_np560_windows.ps1 -Qemu "$env:RUNNER_TEMP/np560-build/qemu-system-dmcu.exe" -OutputDir "$env:RUNNER_TEMP/np560-package" -MsysRoot '${{ steps.msys2.outputs.msys2-location }}'
      - uses: actions/upload-artifact@v4
        with:
          name: np560-windows-x64
          path: ${{ runner.temp }}/np560-package/np560-windows-x64.zip
          if-no-files-found: error

  publish:
    needs: [source-smoke, windows-build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: np560-windows-x64
          path: ${{ runner.temp }}/np560-emulator
      # The private v0.1.0 release holds the reviewed vendor PRG. It is not
      # checked into Git; resident.bin cannot be rebuilt from source alone.
      - name: Fetch and verify V3.80 program image
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/np560-firmware"
          gh release download v0.1.0 --repo "$GITHUB_REPOSITORY" \
            --pattern NP560.PRG --dir "$RUNNER_TEMP/np560-firmware"
          printf '%s  %s\n' \
            'd555609e03ece17f42c1881beeb88361572f18621161de67bc9dc765857089f5' \
            "$RUNNER_TEMP/np560-firmware/NP560.PRG" | sha256sum --check --status
      - name: Rebuild checked resident ROM/HLE bundle
        shell: bash
        run: |
          python3 scripts/build_np560_player_rom.py \
            --firmware "$RUNNER_TEMP/np560-firmware/NP560.PRG" \
            --output "$RUNNER_TEMP/np560-resident"
          printf '%s  %s\n' \
            '18cca3e8bc6f9512ae017935c37d5241b268a83a45920255f8054228bfcb260a' \
            "$RUNNER_TEMP/np560-resident/resident.bin" | sha256sum --check --status
      - name: Create GitHub Release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            options=()
            case "$tag" in
              v0.*|*-rc*|*-beta*) options+=(--prerelease) ;;
            esac
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "$tag" --generate-notes "${options[@]}"
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" \
            "$RUNNER_TEMP/np560-emulator/np560-windows-x64.zip" \
            "$RUNNER_TEMP/np560-firmware/NP560.PRG" \
            "$RUNNER_TEMP/np560-resident/resident.bin" \
            "$RUNNER_TEMP/np560-resident/manifest.json" \
            --clobber
